<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digilab Avontuur – Word & PowerPoint</title>
<style>
:root{--acc:#1f6fb2;--acc2:#3fa0e0;--accl:#e4f1fb;--bg:#f2f7fb;--card:#fff;--ink:#1d2430;--muted:#5d6878;--ok:#1f8a4c;--bad:#c62828;--word:#2b579a;--ppt:#c43e1c;--line:#dde3ea;--warn:#f0a500}
body[data-theme="snoep"]{--acc:#c2185b;--acc2:#f06292;--accl:#fde4ee;--bg:#fff5f9}
body[data-theme="jungle"]{--acc:#2e7d32;--acc2:#66bb6a;--accl:#e3f3e4;--bg:#f3f9f3}
body[data-theme="lava"]{--acc:#d84315;--acc2:#ff8a50;--accl:#fde9e0;--bg:#fff7f3}
body[data-theme="galaxy"]{--acc:#7c6cf0;--acc2:#a796ff;--accl:#2c2a45;--bg:#15142a;--card:#22213a;--ink:#eee;--muted:#aab;--line:#3a3955}
*{box-sizing:border-box}
html{font-size:17px}
body.groot{zoom:1.15}
body{margin:0;font-family:"Segoe UI",Calibri,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.hidden{display:none!important}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-weight:700;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--accl);color:var(--acc)}
.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.btn.okb{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.big{font-size:1.15rem;padding:14px 26px}
/* top */
#top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;position:sticky;top:0;z-index:50;flex-wrap:wrap}
#top .logo{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:8px;cursor:pointer}
#top .logo .lw{background:#fff;color:var(--word);border-radius:6px;padding:0 6px;font-size:.9rem}
#top .logo .lp{background:#fff;color:var(--ppt);border-radius:6px;padding:0 6px;font-size:.9rem}
#top .sp{flex:1}
.chip{background:rgba(255,255,255,.2);border-radius:20px;padding:5px 12px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;border:0;color:#fff}
button.chip:hover{background:rgba(255,255,255,.32)}
.tb{background:#fff;color:var(--acc);border:0;border-radius:20px;padding:6px 12px;font-weight:700;white-space:nowrap}
main{padding:16px;max-width:1500px;margin:0 auto}
/* login */
.login{max-width:560px;margin:30px auto;background:var(--card);border-radius:22px;padding:30px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
.login h1{margin:6px 0;color:var(--acc);font-size:1.8rem}
.login .apps{display:flex;justify-content:center;gap:14px;margin:6px 0 10px}
.appbadge{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:2rem;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.appbadge.w{background:var(--word)}.appbadge.p{background:var(--ppt)}
.login label{display:block;font-weight:700;margin:18px 0 8px;text-align:left}
.login input[type=text]{width:100%;padding:13px;font-size:1.1rem;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.klassen{display:flex;gap:10px;flex-wrap:wrap}
.klassen button{flex:1;min-width:90px;background:var(--accl);color:var(--acc);border:3px solid transparent;border-radius:12px;padding:12px;font-weight:800;font-size:1.1rem}
.klassen button.on{border-color:var(--acc);background:var(--acc);color:#fff}
.prof{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.prof button{background:var(--accl);color:var(--acc);border:0;border-radius:12px;padding:10px 14px;font-weight:700}
/* home */
.hero{display:flex;gap:18px;align-items:center;background:var(--card);border-radius:20px;padding:18px 22px;margin-bottom:18px;box-shadow:0 3px 14px rgba(0,0,0,.05)}
.hero .mas{font-size:3.4rem}
.hero h2{margin:0 0 4px}
.hero p{margin:0;color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.lv{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 3px 14px rgba(0,0,0,.06);cursor:pointer;border:3px solid transparent;transition:.15s;position:relative;text-align:left;color:var(--ink)}
.lv:hover{border-color:var(--acc2);transform:translateY(-3px)}
.lv.locked{opacity:.5;cursor:not-allowed}
.lv.locked:hover{transform:none;border-color:transparent}
.lv .ic{width:60px;height:60px;border-radius:16px;background:var(--accl);display:flex;align-items:center;justify-content:center;font-size:2rem}
.lv .num{position:absolute;top:18px;right:18px;font-weight:800;color:var(--muted);font-size:.9rem}
.lv h3{margin:12px 0 4px;font-size:1.25rem}
.lv p{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.lv .tags{display:flex;gap:6px;margin-bottom:10px}
.tag{font-size:.75rem;font-weight:800;border-radius:6px;padding:2px 7px;color:#fff}
.tag.w{background:var(--word)}.tag.p{background:var(--ppt)}
.prog{height:12px;background:var(--accl);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.stars{font-size:1.5rem;letter-spacing:3px;margin-top:8px}
.stars .off{opacity:.18}
.lv .st{font-size:.85rem;font-weight:700;margin-top:6px}
.lv .st.inl{color:var(--ok)}.lv .st.todo{color:var(--ppt)}
/* level */
.lvwrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.lvwrap .side{padding-bottom:70px}
.side{background:var(--card);border-radius:18px;padding:14px;align-self:start;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.side h3{margin:4px 6px 10px;font-size:1.05rem}
.side .it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;cursor:pointer;font-size:.9rem;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.side .it:hover{background:var(--accl)}
.side .it.cur{background:var(--acc);color:#fff}
.dot{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;background:var(--line);color:#555}
.dot.ok{background:var(--ok);color:#fff}.dot.skip{background:var(--warn);color:#fff}
.side .tinfo{font-size:.8rem;color:var(--muted);margin:10px 6px 0}
.panel{background:var(--card);border-radius:18px;padding:20px 24px;min-width:0;box-shadow:0 3px 14px rgba(0,0,0,.04)}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qtype{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;color:var(--acc);background:var(--accl);padding:4px 11px;border-radius:20px}
.qpts{font-size:.8rem;font-weight:700;color:var(--muted)}
.q{font-size:1.25rem;font-weight:600;margin:6px 0 14px;display:flex;gap:10px;align-items:flex-start}
.q .say{flex:none}
.say{background:var(--accl);color:var(--acc);border:0;border-radius:50%;width:38px;height:38px;font-size:1.1rem}
.say:hover{background:var(--acc);color:#fff}
.fb{margin:14px 0;padding:13px 16px;border-radius:14px;font-weight:600;font-size:1.02rem}
.fb.ok{background:#e4f5ea;color:var(--ok)}.fb.bad{background:#fde8e8;color:var(--bad)}.fb.info{background:var(--accl);color:var(--acc)}
.fb .ex{font-weight:400;color:var(--ink);margin-top:4px}
.navrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.navrow .sp{flex:1}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hintbtn{background:#fff8e1;color:#8a6200;border:2px solid #ffe08a;border-radius:12px;padding:8px 13px;font-weight:700}
.hintbtn:disabled{opacity:.5}
.hintbox{background:#fff8e1;border-left:5px solid #ffc107;border-radius:10px;padding:10px 14px;margin-top:10px}
/* quiz */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:6px}
.opt{text-align:left;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.05rem;color:var(--ink);display:flex;gap:12px;align-items:center}
.opt:hover{border-color:var(--acc2)}
.opt .let{width:32px;height:32px;border-radius:50%;background:var(--accl);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.opt.ok{border-color:var(--ok);background:#e4f5ea}.opt.bad{border-color:var(--bad);background:#fde8e8;animation:shake .35s}
.opt.pic{flex-direction:column;text-align:center}
.opt.pic svg{width:150px;height:auto}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}
/* match / sort / order */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px 30px}
.mcol{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1rem;color:var(--ink);text-align:left;display:flex;align-items:center;gap:10px;min-height:54px}
.card:hover{border-color:var(--acc2)}
.card.sel{border-color:var(--acc);background:var(--accl);box-shadow:0 0 0 3px var(--acc2)}
.card .pn{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.85rem}
.card.ok{border-color:var(--ok);background:#e4f5ea}.card.bad{border-color:var(--bad);background:#fde8e8;animation:shake .35s}
.card svg{width:64px;height:auto;flex:none}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:60px;padding:12px;border-radius:14px;background:var(--bg);border:2px dashed var(--line);margin-bottom:14px}
.pool .card{min-height:auto;padding:9px 13px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.bucket{border:3px dashed var(--line);border-radius:16px;padding:10px;min-height:150px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.bucket:hover{border-color:var(--acc2)}
.bucket h4{margin:2px 4px 4px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.bucket .card{min-height:auto;padding:8px 12px;font-size:.95rem}
.bucket.w h4{color:var(--word)}.bucket.p h4{color:var(--ppt)}
.ordlist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;min-height:60px;padding:12px;border-radius:14px;border:3px dashed var(--acc2);background:var(--accl)}
.ordlist .card .pn{background:var(--acc)}
.ordlist .ph{color:var(--muted);font-style:italic}
/* select / hotspot text */
.doc{background:#fff;color:#111;border:1px solid #cfd6de;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:22px 30px 22px 8px;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:1.05rem;max-width:760px;user-select:text}
.doc .ln{display:flex}
.doc .mg{width:44px;flex:none;cursor:pointer;border-radius:4px}
.doc .mg:hover{background:#e8f1fb}
.doc .mg.mgcur{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'><path d='M20 2 L20 16 L16 12 L11 18 L9 16 L14 11 L10 7 Z' fill='white' stroke='black' stroke-width='1.3'/></svg>") 20 2,pointer}
.doc .para{margin:0 0 12px}
.doc .w{cursor:text;border-radius:3px}
.doc .w.hit,.doc .ln.hit,.doc .para.hit{background:#cfe3f7}
.doc .w.okhit{background:#c8ecd5}
.doc .w.badhit{background:#f9d0d0}
.doc ::selection{background:#bcd7f3}
.doc .ttl{font-size:1.3rem;font-weight:700;color:#1f3864;margin-bottom:8px}
.tclick{border-collapse:collapse;margin:10px 0;font-size:1rem}
.tclick td{border:2px solid #555;width:110px;height:46px;text-align:center;cursor:pointer;background:#fff;color:#111}
.tclick td.hov{background:#ffe9b3}
.tclick td.okc{background:#c8ecd5}.tclick td.badc{background:#f9d0d0}
.tclick th{font-size:.8rem;color:var(--muted);font-weight:600;padding:4px}
.chk{width:100%;border-collapse:collapse;margin-top:12px}
.chk td{padding:8px 6px;border-bottom:1px dashed var(--line)}
.chk td:first-child{width:100%}
.yn{display:flex;gap:6px}
.yn button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 14px;font-weight:700;min-width:64px}
.yn button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.yn button.okc{background:var(--ok);border-color:var(--ok);color:#fff}.yn button.badc{background:var(--bad);border-color:var(--bad);color:#fff}
/* keys */
.kbdzone{background:var(--bg);border:3px dashed var(--acc2);border-radius:16px;padding:26px;text-align:center;outline:none;cursor:pointer}
.kbdzone:focus{border-style:solid;background:var(--accl)}
.kbdzone .big{font-size:1.4rem;font-weight:700}
.kbd{display:inline-block;background:#fff;color:#222;border:2px solid #999;border-bottom-width:5px;border-radius:8px;padding:5px 12px;font-weight:800;font-family:Consolas,monospace;margin:4px;min-width:44px}
.kbd.on{background:#ffe08a;border-color:#c99400}
/* theory */
.theory{max-width:900px;margin:0 auto}
.tcard{background:var(--card);border-radius:22px;padding:24px 28px;box-shadow:0 4px 18px rgba(0,0,0,.06);min-height:300px}
.tcard h2{margin:0 0 12px;color:var(--acc);display:flex;align-items:center;gap:10px}
.tcard .tx{font-size:1.1rem}
.tcard .apptag{font-size:.8rem;font-weight:800;color:#fff;border-radius:6px;padding:2px 8px}
.tdots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.tdots i{width:12px;height:12px;border-radius:50%;background:var(--line);cursor:pointer}
.tdots i.on{background:var(--acc)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tbox{background:var(--accl);border-radius:14px;padding:12px;font-size:.95rem}
.tbox b{display:block;color:var(--acc);font-size:1.05rem;margin-bottom:4px}
.tbox .vb{background:#fff;color:#111;border-radius:8px;padding:6px 8px;margin-top:6px;font-family:Calibri,Arial;text-align:center}
.steps{list-style:none;padding:0;margin:10px 0;counter-reset:st}
ul.steps li::before{display:none}ul.steps li{padding-left:0}
.steps li{counter-increment:st;display:block;position:relative;padding:4px 0 4px 44px;margin:8px 0;font-size:1.05rem;min-height:32px}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--acc2);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.wjd{background:#fff8e1;border:2px solid #ffd54a;border-radius:14px;padding:10px 14px;margin-top:12px;font-size:.98rem}
.wjd b{color:#b58300}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>div{border-radius:14px;padding:10px 14px;background:var(--bg)}
.two h4{margin:2px 0 6px}
.two .wh{color:var(--word)}.two .ph{color:var(--ppt)}
.tbl{border-collapse:collapse;width:100%;font-size:.95rem}
.tbl td,.tbl th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.tbl th{background:var(--accl)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,40,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.md{background:var(--card);color:var(--ink);border-radius:22px;padding:26px;max-width:620px;width:100%;max-height:90vh;overflow:auto;text-align:center;animation:pop .2s}
.md.wide{max-width:900px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.md .bigi{font-size:3.4rem}
.md h2{margin:6px 0 10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;z-index:300;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.mascot{position:fixed;left:16px;bottom:14px;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:8px;z-index:60;pointer-events:none}
.mascot .bub{background:var(--card);color:var(--ink);border-radius:16px 16px 16px 4px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.15);font-weight:700;max-width:240px;opacity:0;transform:translateY(8px);transition:.25s}
.mascot .bub.on{opacity:1;transform:none}
.mascot .face{font-size:2.6rem;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}
.coinfly{position:fixed;font-size:1.6rem;z-index:400;pointer-events:none;transition:all .8s cubic-bezier(.5,-.3,.7,1)}
.conf{position:fixed;width:10px;height:14px;z-index:400;pointer-events:none;top:-20px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;text-align:center;margin:10px 0}
.shop .si{border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.shop .si .e{font-size:2rem}
.shop .si .sw{width:100%;height:30px;border-radius:8px}
.shop .si.own{border-color:var(--ok)}
.shop h3{grid-column:1/-1;text-align:left;margin:10px 0 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.bd{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;opacity:.5}
.bd.got{opacity:1;border-color:#ffc107;background:#fff8e1;color:#222}
.bd .e{font-size:2rem}
.bd small{display:block;color:inherit;opacity:.8}
.ranks{text-align:left}
.rk{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px}
.rk.now{background:var(--accl)}
.rk .re{font-size:1.6rem}
.rk .rn{flex:1}
.rk.done{opacity:.6}
/* ============ OFFICE SIMULATOR ============ */
.office{border:1px solid #c8c6c4;border-radius:10px;overflow:hidden;background:#f3f2f1;color:#222;font-family:"Segoe UI",Arial,sans-serif;font-size:13px;user-select:none}
.office .titlebar{display:flex;align-items:center;gap:10px;color:#fff;padding:6px 12px;font-size:13px}
.office.word .titlebar{background:var(--word)}
.office.ppt .titlebar{background:var(--ppt)}
.office .titlebar .an{font-weight:800;background:#fff;border-radius:4px;padding:0 6px}
.office.word .titlebar .an{color:var(--word)}.office.ppt .titlebar .an{color:var(--ppt)}
.office .titlebar .fn{flex:1;text-align:center}
.office .tabs{display:flex;gap:2px;background:#fff;padding:4px 8px 0;border-bottom:1px solid #e1dfdd;flex-wrap:wrap}
.office .tab{background:none;border:0;padding:7px 12px 8px;font-size:13px;color:#333;border-bottom:3px solid transparent}
.office .tab:hover{background:#f3f2f1}
.office.word .tab.on{color:var(--word);border-bottom-color:var(--word);font-weight:700}
.office.ppt .tab.on{color:var(--ppt);border-bottom-color:var(--ppt);font-weight:700}
.office .tab.ctx{color:#7a3e9d;font-weight:700}
.office .ribbon{display:flex;background:#fff;padding:6px 4px 0;border-bottom:1px solid #e1dfdd;min-height:112px;overflow-x:auto}
.grp{display:flex;flex-direction:column;border-right:1px solid #e1dfdd;padding:0 6px;flex:none}
.grp .gi{display:flex;gap:3px;align-items:flex-start;flex:1}
.grp .gn{font-size:11px;color:#666;text-align:center;padding:3px 0 4px;position:relative;white-space:nowrap}
.grp .gn .dlg{position:absolute;right:-4px;bottom:2px;width:16px;height:16px;border:0;background:none;padding:0;color:#666;font-size:11px;border-radius:2px}
.grp .gn .dlg:hover{background:#e1dfdd}
.rows{display:flex;flex-direction:column;gap:3px}
.rows .r{display:flex;gap:2px;align-items:center}
.colb{display:flex;flex-direction:column;gap:1px}
.rb{background:none;border:1px solid transparent;border-radius:3px;color:#222;display:flex;align-items:center;justify-content:center;gap:3px;padding:2px 4px;font-size:12px;position:relative}
.rb:hover{background:#e1dfdd;border-color:#c8c6c4}
.rb.L{flex-direction:column;min-width:52px;height:76px;padding:4px;white-space:normal;text-align:center;line-height:1.15;max-width:78px}
.rb.L svg{width:32px;height:32px;margin-bottom:2px}
.rb.S svg{width:17px;height:17px}
.rb.S{height:26px;min-width:26px}
.rb.SL{justify-content:flex-start;height:24px;white-space:nowrap}

.page img.oimg.wrap-boven{display:block;margin:6px 0}
img.oimg.osel{outline:2px solid #2b579a;outline-offset:2px}

@keyframes pvWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pvSplit{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 0 0 0)}}
.an-verschijnen{animation:anAppear .6s steps(1)}
.an-vervagen{animation:pvFade 1s}
.an-invliegen{animation:anFly .8s}
.an-zwevend{animation:anFloat 1s}

@keyframes anFloat{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}

.ed-steps li::before{content:counter(es);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--acc2);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.ed-steps li.ok::before{content:"✓";background:var(--ok)}

.btn.chkbtn:not(:disabled){animation:pulse 1.6s infinite}
.btn.chkbtn:disabled{background:#9aa5b1;box-shadow:0 5px 0 #6b7785}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 #136437,0 0 0 0 rgba(31,138,76,.55)}50%{box-shadow:0 5px 0 #136437,0 0 0 14px rgba(31,138,76,0)}}

.chkhint.on{color:var(--ok)}.chkhint.off{color:var(--muted);font-weight:600}
.chkbtn:not(:disabled)~.chkhint.on{display:inline;animation:nudgeL 1.2s infinite}
.chkbtn:disabled~.chkhint.off{display:inline}
@keyframes nudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
.chkhint.on{display:none}

function rgbOf(hex){hex=hex.replace("#","");const n=parseInt(hex,16);return `rgb(${(n>>16)&255}, ${(n>>8)&255}, ${n&255})`;}
const MARG = {normaal:[2.5,2.5],smal:[1.27,1.27],gemiddeld:[2.54,1.91],breed:[2.54,5.08]};

class Office{
 constructor(host,opt){
  this.host=host;this.o=opt;this.app=opt.app;this.mode=opt.mode;this.R=this.app==="word"?W_RIBBON:P_RIBBON;
  this.tab=opt.startTab||"start";this.range=null;this.st=Object.assign({or:"staand",m:"normaal",marks:false,taal:"Nederlands (België)",theme:"office",trans:"geen",layout:"titelobject",snr:false,sfoot:"",sfootOn:false,size:"liggend"},opt.state||{});
  this.selImg=null;this.selObj=null;this.fmtBrush=null;
  this.render();
 }
 ribbonHTML(){
  const t=this.R.find(x=>x.id===this.tab)||this.R[1];
  const B=(b,cls)=>{const full=t.id+"."+b.id;
    if(b.sel)return `<button class="rb sel" data-b="${full}" title="${esc(b.label)}" style="width:${b.w}px"><span>${b.sel==="font"?(this.curFont||"Aptos"):(this.curSize||(this.app==="ppt"?"18":"11"))}</span><span class="dd">▼</span></button>`;
    const ic=b.icon?svg(b.icon):`<span class="g">${b.g||""}</span>`;
    return `<button class="rb ${cls}" data-b="${full}" title="${esc(b.tip||b.label)}">${ic}${cls!=="S"?`<span>${esc(b.label)}</span>`:""}${b.dd?'<span class="dd">▼</span>':""}</button>`;};
  return t.groups.map(g=>{
    const inner=g.items.map(it=>{
      if(it.L)return B(it.L,"L");
      if(it.rows)return `<div class="rows">${it.rows.map(r=>`<div class="r">${r.map(b=>B(b,"S")).join("")}</div>`).join("")}</div>`;
      if(it.col)return `<div class="colb">${it.col.map(b=>B(b,"SL")).join("")}</div>`;
      if(it.styles)return `<div class="r" style="display:flex;gap:2px">${it.styles.map(s=>`<button class="rb sty" data-b="${t.id}.${s.id}" title="${esc(s.label)}"><span class="pv">${s.p}</span>${esc(s.label)}</button>`).join("")}</div>`;
      if(it.tiles)return `<div style="display:flex;gap:3px">${it.tiles.map(s=>{const on=(s.kind==="thema"&&this.st.theme===s.k)||(s.kind==="over"&&this.st.trans===s.k)||(s.kind==="anim"&&this.selObj&&(this.selObj.dataset.anim||"geen")===s.k);return `<button class="rb tile ${on&&this.mode==="edit"?"on":""}" data-b="${t.id}.${s.id}" title="${esc(s.label)}">${tileHTML(s.kind,s.k,s.n)}</button>`;}).join("")}</div>`;
      return "";}).join("");
    const dlg=g.dlg?`<button class="dlg" data-b="${t.id}.dlg_${g.name.toLowerCase().replace(/[^a-z]/g,"")}" title="Meer opties voor ${esc(g.name)}">↘</button>`:"";
    return `<div class="grp"><div class="gi">${inner}</div><div class="gn">${esc(g.name)}${dlg}</div></div>`;}).join("");
 }
 tabsHTML(){
  return this.R.filter(t=>!t.ctx||(t.id==="afbeelding"&&this.selImg)).map(t=>`<button class="tab ${t.id===this.tab?"on":""} ${t.ctx?"ctx":""}" data-tab="${t.id}">${t.name}</button>`).join("");
 }
 statusHTML(){
  if(this.app==="word")return `<span>Pagina 1 van 1</span><span class="wc">${this.mode==="find"?"12 woorden":"Woorden"}</span><button class="sb" data-b="status.spelling" title="Spelling en grammatica controleren">${svg(this.mode==="find"?"bookx":"book")}</button><button class="sb" data-b="status.taal" title="Taal">${esc(this.st.taal)}</button><span style="flex:1"></span><span>100%</span>`;
  return `<span>Dia 1 van 1</span><button class="sb" data-b="status.taal" title="Taal">${esc(this.st.taal)}</button><button class="sb" data-b="status.spelling" title="Spelling controleren">${svg("book")}</button><span style="flex:1"></span><span>Notities</span><span>100%</span>`;
 }
 render(){
  const fn=this.o.fileName||(this.app==="word"?"Document1":"Presentatie1");
  this.host.innerHTML=`<div class="office ${this.app} ${this.mode==="find"?"findmode":""}">
   <div class="titlebar"><span class="an">${this.app==="word"?"W":"P"}</span><span>${svg("saveW")}</span><span class="fn">${esc(fn)} - ${this.app==="word"?"Word":"PowerPoint"}</span><span>🔍 Zoeken</span></div>
   <div class="tabs"></div><div class="ribbon"></div>
   <div class="canvas"></div><div class="statusbar"></div></div>`;
  this.el=this.host.firstChild;
  this.$tabs=this.el.querySelector(".tabs");this.$rib=this.el.querySelector(".ribbon");this.$cv=this.el.querySelector(".canvas");this.$sb=this.el.querySelector(".statusbar");
  this.refreshRibbon();this.$sb.innerHTML=this.statusHTML();
  this.el.addEventListener("mousedown",e=>{if(e.target.closest(".rb,.tab,.sb,.dlg"))e.preventDefault();});
  this.el.addEventListener("click",e=>this.onClick(e));
  if(this.mode==="find"){this.$cv.innerHTML=`<div class="fake">${this.app==="word"?"Hier komt je tekst ...":"Klik om titel toe te voegen"}</div>`;return;}
  if(this.app==="word")this.buildPage();else this.buildSlide();
  this.selHandler=()=>{const s=getSelection();if(s.rangeCount&&this.$cv.contains(s.anchorNode))this.range=s.getRangeAt(0).cloneRange();};
  document.addEventListener("selectionchange",this.selHandler);

 }
 destroy(){if(this.selHandler)document.removeEventListener("selectionchange",this.selHandler);closeMenus();}
 refreshRibbon(){this.$tabs.innerHTML=this.tabsHTML();this.$rib.innerHTML=this.ribbonHTML();}
 onClick(e){
  const tb=e.target.closest(".tab");
  if(tb){const id=tb.dataset.tab;
    if(this.mode==="find"&&this.o.tabTarget){this.o.onAnswer("tab:"+id,tb);return;}
    this.tab=id;closeMenus();this.refreshRibbon();if(this.mode==="find"&&this.o.onTab)this.o.onTab(id);return;}
  const b=e.target.closest("[data-b]");
  if(!b)return;
  if(this.mode==="find"){if(!this.o.tabTarget)this.o.onAnswer(b.dataset.b,b);return;}
  this.act(b.dataset.b,b);
 }
 /* ---------------- WORD-PAGINA ---------------- */
 buildPage(){
  const s=this.st;
  this.$cv.innerHTML=`<div class="page"><div class="hdr" data-l="Koptekst"></div><div class="body" contenteditable="true" spellcheck="false"></div><div class="ftr" data-l="Voettekst"></div></div>`;
  this.page=this.$cv.querySelector(".page");this.body=this.page.querySelector(".body");this.hdr=this.page.querySelector(".hdr");this.ftr=this.page.querySelector(".ftr");
  this.body.innerHTML=this.o.html||"<p><br></p>";
  if(s.header)this.hdr.innerHTML=s.header;if(s.footer)this.ftr.innerHTML=s.footer;
  this.applyPage();
  [this.hdr,this.ftr].forEach(h=>h.addEventListener("dblclick",()=>this.activateHF(h)));
  this.body.addEventListener("focus",()=>this.deactivateHF());
  this.body.addEventListener("mousedown",()=>this.deactivateHF());
  this.body.addEventListener("click",e=>{const im=e.target.closest("img.oimg");this.selectImg(im||null);});
  this.body.addEventListener("input",()=>this.updWc());
  this.body.addEventListener("mouseup",()=>{if(this.fmtBrush)this.applyBrush();});
  this.body.addEventListener("keydown",e=>this.keys(e));

 }
 applyPage(){
  const s=this.st,m=MARG[s.m]||MARG.normaal,f=22;

  this.page.classList.toggle("marks",!!s.marks);
 }
 activateHF(h){[this.hdr,this.ftr].forEach(x=>{x.classList.add("act");x.contentEditable="true";});setTimeout(()=>{h.focus();const r=document.createRange();r.selectNodeContents(h);r.collapse(false);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);},0);}
 deactivateHF(){[this.hdr,this.ftr].forEach(x=>{x.classList.remove("act");x.contentEditable="false";});}
 selectImg(im){
  if(this.selImg)this.selImg.classList.remove("osel");
  this.selImg=im;if(im){im.classList.add("osel");}
  const had=this.R.some(t=>t.id==="afbeelding");
  if(!im&&this.tab==="afbeelding")this.tab="start";
  if(im&&this.app==="word")this.tab="afbeelding";

  if(this.app==="ppt"){this.selObj=im;this.refreshRibbon();}
 }
 updWc(){if(this.app!=="word")return;const n=(this.body.innerText.match(/\S+/g)||[]).length;const wc=this.$sb.querySelector(".wc");if(wc)wc.textContent=n+" woorden";}
 keys(e){
  if(!e.ctrlKey&&!e.metaKey)return;const k=e.key.toLowerCase();
  const map={b:"start.vet",i:"start.cursief",u:"start.onderstrepen",e:"start.centreren",r:"start.rechts",l:"start.links",j:"start.uitvullen"};

 }
 /* ---------------- POWERPOINT-DIA ---------------- */
 buildSlide(){
  this.$cv.innerHTML=`<div class="slidewrap"><div class="thumbs"><div style="font-size:11px;color:#555">1</div><div class="th"></div></div><div class="slide"></div></div>`;
  this.slide=this.$cv.querySelector(".slide");this.thumb=this.$cv.querySelector(".th");
  const sl=this.o.slide||{};this.st.layout=sl.layout||this.st.layout;
  this.phText={t:sl.title||"",b:sl.body||"",s:sl.sub||"",l:sl.left||"",r:sl.right||""};
  this.layoutSlide();
  (sl.imgs||[]).forEach(n=>this.insertImg(n,true));
  this.applySlide();
  this.slide.addEventListener("click",e=>{const im=e.target.closest("img.oimg");const ph=e.target.closest(".ph,.tbx");
    if(im){this.selectObj(im);}else if(ph){this.selectObj(ph);}else this.selectObj(null);});

 layoutSlide(){
  this.slide.querySelectorAll(".ph").forEach(p=>{this.phText[p.dataset.k]=p.innerHTML;p.remove();});
  const L=this.st.layout,stand=this.st.size==="staand";
  const P=(k,x,y,w,h,cls,ph,extra)=>`<div class="ph ${cls}" data-k="${k}" contenteditable="true" spellcheck="false" data-ph="${ph}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;${extra||""}">${this.phText[k]||""}</div>`;

  const old=this.st.layout;this.slide.querySelectorAll(".ph").forEach(p=>this.phText[p.dataset.k]=p.innerHTML);

  if(L==="vergelijking"&&!this.phText.l&&this.phText.b){this.phText.l=this.phText.b;this.phText.b="";}
  if(L==="titelobject"&&!this.phText.b&&this.phText.l){this.phText.b=this.phText.l;this.phText.l="";}
  if(L==="titeldia"&&!this.phText.s&&this.phText.b&&old!=="titeldia"){/* body blijft bewaard */}
  this.st.layout=L;this.layoutSlide();this.applySlide();
 }
 applySlide(){

/* ============================================================
   CONTROLES voor doe-opdrachten
   ============================================================ */
function makeT(off){
  const root=off.app==="word"?off.body:off.slide;
  const scope=off.$cv;
  const txt=n=>(n.innerText||n.textContent||"").replace(/ /g," ");
  function segs(text,where){
    const base=where||root;const w=document.createTreeWalker(base,NodeFilter.SHOW_TEXT);const nodes=[];let all="";let n;
    while((n=w.nextNode())){nodes.push([n,all.length]);all+=n.data.replace(/ /g," ");}
    const i=all.indexOf(text);if(i<0)return null;const end=i+text.length;const out=[];
    nodes.forEach(([nd,st])=>{const en=st+nd.data.length;if(en>i&&st<end){const piece=nd.data.slice(Math.max(0,i-st),Math.min(nd.data.length,end-st));if(piece.trim())out.push(nd.parentElement);}});
    return out;}
  const chain=(el,f)=>{while(el&&el!==root&&el!==scope){if(f(el))return true;el=el.parentElement;}return false;};
  const blockOf=el=>{while(el&&el!==root&&!/^(P|H1|H2|H3|LI|TD|DIV)$/.test(el.tagName))el=el.parentElement;return el;};
  const T={
   style:(text,pred)=>{const s=segs(text);return !!s&&s.length>0&&s.every(pred);},
   isBold:el=>parseInt(getComputedStyle(el).fontWeight)>=600,
   isItalic:el=>getComputedStyle(el).fontStyle==="italic",
   isUnderline:el=>chain(el,e=>getComputedStyle(e).textDecorationLine.includes("underline")),
   not:f=>el=>!f(el),
   color:hex=>el=>getComputedStyle(el).color===rgbOf(hex),
   hl:hex=>el=>chain(el,e=>getComputedStyle(e).backgroundColor===rgbOf(hex)),
   size:pt=>el=>Math.abs(parseFloat(getComputedStyle(el).fontSize)-pt*4/3)<0.7,
   font:name=>el=>getComputedStyle(el).fontFamily.toLowerCase().replace(/["']/g,"").startsWith(name.toLowerCase()),
   block:text=>{const s=segs(text);return s&&s.length?blockOf(s[0]):null;},
   align:(text,v)=>{const b=T.block(text);if(!b)return false;let a=getComputedStyle(b).textAlign;if(a==="start")a="left";return a===v;},
   inList:(texts,tag)=>texts.every(x=>{const b=T.block(x);return b&&b.tagName==="LI"&&(!tag||b.parentElement.tagName===tag.toUpperCase());}),
   tag:(text,cls)=>{const b=T.block(text);return !!b&&b.classList.contains(cls);},
   space:(text,v,n)=>{const b=T.block(text);if(!b)return false;const cs=getComputedStyle(b);return Math.abs(parseFloat(cs.marginTop)*0.75-v)<0.6&&Math.abs(parseFloat(cs.marginBottom)*0.75-n)<0.6;},
   lh:(text,v)=>{const b=T.block(text);return !!b&&Math.abs(parseFloat(b.style.lineHeight||"1")-v)<0.01;},
   shade:(text,hex)=>{const b=T.block(text);return !!b&&getComputedStyle(b).backgroundColor===rgbOf(hex);},
   border:(text,kind)=>{const b=T.block(text);return !!b&&b.dataset.border===kind;},
   table:(c,r)=>{const t=root.querySelector("table");return !!t&&t.rows.length===r&&[...t.rows].every(x=>x.cells.length===c);},
   cells:(row,arr)=>{const t=root.querySelector("table");if(!t||!t.rows[row])return false;return arr.every((v,i)=>t.rows[row].cells[i]&&txt(t.rows[row].cells[i]).toLowerCase().includes(v.toLowerCase()));},
   img:n=>!!root.querySelector(`img[data-name="${n}"]`),
   anyImg:()=>!!root.querySelector("img.oimg"),
   wrap:v=>[...root.querySelectorAll("img.oimg")].some(i=>i.dataset.wrap===v),
   imgSmaller:()=>[...root.querySelectorAll("img.oimg")].some(i=>i.offsetWidth&&i.offsetWidth<120),
   imgBigger:()=>[...root.querySelectorAll("img.oimg")].some(i=>i.offsetWidth>120),
   state:(k,v)=>off.st[k]===v,
   header:s=>txt(off.hdr).toLowerCase().includes(s.toLowerCase()),
   footer:s=>txt(off.ftr).toLowerCase().includes(s.toLowerCase()),
   footerName:()=>{const t=txt(off.ftr).replace(/\d/g,"").trim();return t.length>=3;},
   pagenr:where=>!!(where==="hdr"?off.hdr:off.ftr).querySelector(".pnr"),
   text:()=>txt(root),
   tbx:s=>[...root.querySelectorAll('.tbx')].some(x=>txt(x).toLowerCase().includes(s.toLowerCase())),
   words:k=>{const p=root.querySelector(`.ph[data-k="${k}"]`);return p?(txt(p).match(/\S+/g)||[]).length:0;},
   has:s=>txt(root).replace(/\s+/g," ").toLowerCase().includes(s.toLowerCase()),
   hasExact:s=>txt(root).replace(/\s+/g," ").includes(s),
   noErr:()=>!root.querySelector(".sp-err"),
   symAfter:(word,sym)=>new RegExp(word+"\\s*"+sym,"i").test(txt(root).replace(/ /g," ")),
   // PowerPoint
   layout:v=>off.st.layout===v,
   theme:v=>v?off.st.theme===v:off.st.theme!=="office",
   trans:v=>v?off.st.trans===v:off.st.trans!=="geen",
   anim:(sel,v)=>{const els=sel==="img"?[...root.querySelectorAll("img.oimg")]:[...root.querySelectorAll(sel)];return els.some(e=>v?e.dataset.anim===v:(e.dataset.anim&&e.dataset.anim!=="geen"));},
   animStart:v=>[...root.querySelectorAll("[data-anim]")].some(e=>e.dataset.anim!=="geen"&&e.dataset.start===v),
   ph:k=>{const p=root.querySelector(`.ph[data-k="${k}"]`);return p?txt(p).trim():null;},
   phEl:k=>root.querySelector(`.ph[data-k="${k}"]`),
   lines:k=>{const p=root.querySelector(`.ph[data-k="${k}"]`);if(!p)return [];return txt(p).split("\n").map(x=>x.trim()).filter(Boolean);},
   bullets:k=>{const p=root.querySelector(`.ph[data-k="${k}"]`);return p?[...p.querySelectorAll("li")].filter(l=>txt(l).trim()).length:0;},
   slidenr:()=>!!off.st.snr,
   sfooter:s=>off.st.sfootOn&&off.st.sfoot.toLowerCase().includes(s.toLowerCase()),
   size2:v=>off.st.size===v
  };
  return T;
}

  <div><h4 class="ph">PowerPoint: thema's</h4><p>Kleuren, lettertype en achtergrond van alle dia's.</p><ol class="steps"><li>Tabblad <b>Ontwerpen</b></li><li>Rubriek <b>Thema's</b></li><li>Klik op een thema</li></ol></div></div>

 {id:"L2e2",type:"editor",app:"word",short:"Sport is top",title:"Laat woorden opvallen",file:"Sport",
  html:"<p>Sport is top!</p><p>Wat je keuze ook is, sport zet mensen in beweging. Aanmoedigen is even belangrijk als de sport zelf uitoefenen.</p><p>In de klassieke oudheid werd er al gesport. Er werden toen al Olympische Spelen gehouden door de Grieken.</p>",
  steps:["Geef de titel <b>Sport is top!</b> het lettertype <b>Arial</b>.","Geef de titel de lettergrootte <b>16</b>.","<b>Markeer</b> het woord <b>sport</b> in de eerste zin in het <b>geel</b>.","Geef de woorden <b>Olympische Spelen</b> de tekenkleur <b>rood</b>."],

 {id:"L2e4",type:"editor",app:"word",short:"Alinea-afstand",title:"Stel de alinea-afstand in",file:"Onze school",
  html:"<p>Onze school</p><p>Onze school ligt vlak bij het station. Je kan er makkelijk met de bus of de fiets komen.</p><p>Er is een grote speelplaats met een voetbalveld en een basketbalpaal.</p><p>In de refter kan je 's middags een warme maaltijd eten.</p>",
  steps:["Selecteer <b>alle tekst</b> met "+KBD("Ctrl")+" + "+KBD("A")+".","Klik op het uitvouwpijltje <b>↘</b> van de rubriek <b>Alinea</b> (tabblad Start).","Stel <b>Voor: 6 pt</b> en <b>Na: 12 pt</b> in en klik op <b>OK</b>.","Klik in de alinea 'Onze school ligt ...' en kies de regelafstand <b>1,5</b>."],

const $=(s,r)=>(r||document).querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function plain(h){const d=document.createElement("div");d.innerHTML=String(h).replace(/<br\s*\/?>/g,". ");return (d.innerText||d.textContent||"").replace(/\s+/g," ").trim();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function flyCoins(n,from){const tgt=$("#cCoins");if(!tgt)return;const r=tgt.getBoundingClientRect();const f=from?from.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2};

   ============================================================ */
function maxOf(e){return e.max||(e.type==="editor"||e.type==="checklist"?10:5);}
function half(x){return Math.round(x*2)/2;}
function fmtP(x){return String(half(x)).replace(".",",");}
function penalty(e,h){return maxOf(e)*((h.includes(1)?CONFIG.HINT1_AFTREK:0)+(h.includes(2)?CONFIG.HINT2_AFTREK:0));}
function scoreFor(e,r){const a=CONFIG.PUNTEN[e.type]||CONFIG.PUNTEN.quiz;const base=a[Math.min(Math.max(r.att,1),a.length)-1]*maxOf(e)/a[0];return Math.max(0,half(base-penalty(e,r.hints||[])));}
function coinsFor(e,att){if(e.type==="editor"||e.type==="checklist")return att<=2?20:10;return att<=1?10:5;}
function exScore(e,r){if(!r)return 0;const s=r.done?Math.max(r.score||0,r.partial||0):r.skip?(r.partial||0):0;return Math.min(maxOf(e),half(s));}
function lvStats(L,p){p=p||P;let score=0,max=0,done=0,hand=0,hints=0,perfect=true;
  L.ex.forEach(e=>{const r=p.ex[e.id]||{};max+=maxOf(e);score+=exScore(e,r);if(r.done){done++;if(r.att>1)perfect=false;}else perfect=false;if(r.done||r.skip)hand++;hints+=(r.hints||[]).length;});
  score=half(score);const total=L.ex.length,pct=max?Math.round(score/max*100):0,finished=hand===total;
  const stars=!finished?0:pct>=90?3:pct>=70?2:pct>=50?1:0;return {score,max,done,hand,total,pct,finished,hints,perfect,stars};}
function totalXP(p){return half(LEVELS.reduce((a,L)=>a+lvStats(L,p||P).score,0));}
function totalMax(){return LEVELS.reduce((a,L)=>a+lvStats(L).max,0);}
function rankOf(xp){let i=0;RANKS.forEach((r,k)=>{if(xp>=r[0])i=k;});return {i,name:RANKS[i][1],e:RANKS[i][2],next:RANKS[i+1]?RANKS[i+1][0]:null};}
function unlocked(idx){if(CONFIG.ALLE_LEVELS_OPEN||idx===0)return true;const prev=LEVELS[idx-1];return lvStats(prev).finished&&!!P.levelExported[prev.id];}

/* ============================================================

let CUR={L:null,s:0,i:0};
/* volgorde van een level: uitleg-blokjes tussen de oefeningen */
function seqOf(L){if(L._seq)return L._seq;const cards=THEORY[L.id]||[];const seq=[];
  L.ex.forEach((e,i)=>{const cs=cards.filter(c=>c.before===e.id);if(cs.length)seq.push({k:"th",cards:cs,key:e.id});seq.push({k:"ex",i});});
  const loose=cards.filter(c=>!L.ex.some(e=>e.id===c.before));if(loose.length)seq.unshift({k:"th",cards:loose,key:"start"});
  return L._seq=seq;}
const thKey=(L,b)=>L.id+":"+b.key;
const thSeen=(L,b)=>!!P.theorySeen[thKey(L,b)];
function thTotals(p){let n=0,seen=0;LEVELS.forEach(L=>seqOf(L).forEach(b=>{if(b.k==="th"){n++;if(p.theorySeen[thKey(L,b)])seen++;}}));return [seen,n];}
function openLevel(L,i){const seq=seqOf(L);let s;
  if(i===undefined){let f=L.ex.findIndex(e=>{const r=P.ex[e.id];return !r||(!r.done&&!r.skip);});if(f<0)f=0;
    s=seq.findIndex(x=>x.k==="ex"&&x.i===f);if(s>0&&seq[s-1].k==="th"&&!thSeen(L,seq[s-1]))s--;}
  else s=seq.findIndex(x=>x.k==="ex"&&x.i===i);
  CUR={L,s:Math.max(0,s),i:0};renderLevel();}
function renderLevel(){
  cleanup();const {L}=CUR,seq=seqOf(L),s=lvStats(L),cur=seq[CUR.s];if(cur.k==="ex")CUR.i=cur.i;
  $("#main").innerHTML=`<div class="lvwrap"><aside class="side">
    <button class="btn sec" id="back" style="width:100%;margin-bottom:10px">🏠 Levels</button>
    <h3>${L.emoji} ${esc(L.title)}</h3>
    ${seq.map((x,k)=>{if(x.k==="th")return `<button class="it th ${k===CUR.s?"cur":""}" data-s="${k}"><span class="dot thd ${thSeen(L,x)?"ok":""}">📖</span><span><b>Uitleg:</b> ${esc(x.cards[0].t)}</span></button>`;
      const e=L.ex[x.i],r=P.ex[e.id]||{};return `<button class="it ${k===CUR.s?"cur":""}" data-s="${k}"><span class="dot ${r.done?"ok":r.skip?"skip":""}">${r.done?"✓":r.skip?"»":x.i+1}</span><span>${TYPEICON[e.type]} ${esc(e.short)}</span></button>`;}).join("")}
    <div class="tinfo"><div class="prog"><i style="width:${Math.round(s.hand/s.total*100)}%"></i></div>${s.hand}/${s.total} klaar · ${fmtP(s.score)}/${s.max} punten</div>
    ${s.finished?`<button class="btn okb" id="inlBtn" style="width:100%;margin-top:10px">📤 Lever in op Teams</button>`:""}
   </aside><section class="panel" id="panel"></section></div>`;
  $("#back").onclick=goHome;
  document.querySelectorAll(".side .it").forEach(b=>b.onclick=()=>{CUR.s=+b.dataset.s;renderLevel();});
  if($("#inlBtn"))$("#inlBtn").onclick=()=>exportLevelModal(L);
  const ci=$(".side .it.cur");if(ci)ci.scrollIntoView({block:"nearest"});
  if(cur.k==="th")renderTheoryBlock(cur);else renderEx();
  window.scrollTo(0,0);
}
const TYPEICON={quiz:"❓",ribbon:"🔍",keys:"⌨️",match:"🔗",sort:"🗂️",order:"🔢",select:"🖱️",hotspot:"👆",checklist:"✅",editor:"🛠️"};
const TYPENAME={quiz:"Kies het juiste antwoord",ribbon:"Zoek de knop",keys:"Sneltoets",match:"Verbind wat bij elkaar hoort",sort:"Sorteer",order:"Zet in de juiste volgorde",select:"Selecteer met de muis",hotspot:"Klik op de juiste plaats",checklist:"Kijk goed",editor:"Doe-opdracht"};
function appTag(c){return c.app==="w"?'<span class="apptag" style="background:var(--word)">Word</span>':c.app==="p"?'<span class="apptag" style="background:var(--ppt)">PowerPoint</span>':c.app==="wp"?'<span class="apptag" style="background:var(--word)">Word</span><span class="apptag" style="background:var(--ppt)">PowerPoint</span>':"";}

/* ---------- uitleg-blokje tussen de oefeningen ---------- */
function renderTheoryBlock(b){
  const {L}=CUR,cards=b.cards;let k=0;const panel=$("#panel");
  const n=seqOf(L).slice(CUR.s+1).findIndex(x=>x.k==="th");const nEx=(n<0?seqOf(L).length-CUR.s-1:n);
  const draw=()=>{const c=cards[k];
    panel.innerHTML=`<div class="qhead"><span class="qtype">📖 Uitleg</span>${cards.length>1?`<span class="qpts">Kaartje ${k+1} van ${cards.length}</span>`:""}</div>
     <div class="tcard flat"><h2>${esc(c.t)} ${appTag(c)}<span style="flex:1"></span><button class="say" id="thSay" title="Lees voor">🔊</button></h2><div class="tx">${c.html}</div></div>
     ${cards.length>1?`<div class="tdots">${cards.map((_,j)=>`<i class="${j===k?"on":""}" data-j="${j}"></i>`).join("")}</div>`:""}
     <div class="navrow"><button class="btn sec" id="thPrev" ${k||CUR.s?"":"disabled"}>◀ Vorige</button><span class="sp"></span>
     ${k<cards.length-1?`<button class="btn big" id="thNext">Volgend kaartje ▶</button>`:`<button class="btn okb big" id="thGo">Begrepen! Oefenen maar (${nEx}) ▶</button>`}</div>`;
    $("#thSay").onclick=()=>speak(c.t+". "+c.html);if(P.settings.voorlezen)speak(c.t+". "+c.html);
    $("#thPrev").onclick=()=>{if(k){k--;draw();}else{CUR.s--;renderLevel();}};
    if($("#thNext"))$("#thNext").onclick=()=>{k++;draw();};
    panel.querySelectorAll(".tdots i").forEach(d=>d.onclick=()=>{k=+d.dataset.j;draw();});
    if($("#thGo"))$("#thGo").onclick=()=>{if(!thSeen(L,b)){P.theorySeen[thKey(L,b)]=Date.now();if(seqOf(L).every(x=>x.k!=="th"||thSeen(L,x)))P.theorySeen[L.id]=Date.now();save();checkBadges();}CUR.s++;renderLevel();};};
  draw();
}

/* ---------- oefening ---------- */
function renderEx(){
  cleanup();const {L,i}=CUR,e=L.ex[i],r=R(e.id),pr=!!r.done,seq=seqOf(L),nx=seq[CUR.s+1];
  const panel=$("#panel");
  panel.innerHTML=`<div class="qhead"><span class="qtype">${TYPEICON[e.type]} ${TYPENAME[e.type]}</span>${e.app?`<span class="tag ${e.app==="word"?"w":"p"}">${e.app==="word"?"Word":"PowerPoint"}</span>`:""}<span class="qpts">Oefening ${i+1} van ${L.ex.length} · max. ${maxOf(e)} punten</span></div>
   ${pr?`<div class="fb ok">✔ Deze oefening is al juist (${fmtP(exScore(e,r))}/${maxOf(e)} ptn). Je mag ze opnieuw oefenen, maar je punten veranderen niet.</div>`:r.skip?`<div class="fb info">» Je sloeg deze oefening over. Probeer ze nu nog eens: als ze lukt, krijg je toch punten!</div>`:""}
   <div class="q"><button class="say" id="qSay" title="Lees voor">🔊</button><div>${e.title?`<b>${e.title}</b>`:e.q}</div></div>
   <div id="exBody"></div><div id="fb"></div><div class="hints" id="hints"></div>
   <div class="navrow"><button class="btn sec" id="prevB" ${CUR.s?"":"disabled"}>◀ Vorige</button><span class="sp"></span><button class="btn ghost hidden" id="skipB">Sla over »</button><button class="btn" id="nextB">${!nx?"Klaar 🏁":nx.k==="th"?"Verder: nieuwe uitleg 📖 ▶":"Volgende ▶"}</button></div>`;
  $("#qSay").onclick=()=>speak((e.title||e.q)+(e.steps?". "+e.steps.join(". "):""));
  if(P.settings.voorlezen)speak(e.title||e.q);
  $("#prevB").onclick=()=>{CUR.s--;renderLevel();};
  $("#nextB").onclick=()=>nextEx();
  $("#skipB").onclick=()=>skipEx(e);
  const ctx={e,r,practice:pr,body:$("#exBody"),ok:(from,extra)=>succeed(e,from,extra),bad:(msg,from)=>fail(e,msg,from)};
  RENDER[e.type](ctx);
  drawHints(e);updSkip(e);
}
function nextEx(){const {L}=CUR,seq=seqOf(L);if(CUR.s<seq.length-1){CUR.s++;renderLevel();return;}
  const s=lvStats(L);if(s.finished){levelDoneModal(L);return;}
  const open=L.ex.findIndex(x=>{const r=P.ex[x.id];return !r||(!r.done&&!r.skip);});
  modal(`<div class="bigi">🧩</div><h2>Bijna!</h2><p>Je hebt nog <b>${s.total-s.hand}</b> oefening(en) niet gemaakt in dit level.</p><button class="btn" data-close="go">Ga naar oefening ${open+1}</button> <button class="btn ghost" data-close>Sluiten</button>`,v=>{if(v==="go"){CUR.s=seq.findIndex(x=>x.k==="ex"&&x.i===open);renderLevel();}});
}
function drawHints(e){
  const r=R(e.id),box=$("#hints");if(!e.hint1){box.innerHTML="";return;}
  const has1=r.hints.includes(1),has2=r.hints.includes(2);
  box.innerHTML=`${!has1?`<button class="hintbtn" id="h1">💡 Tip (${CONFIG.HINT1_PRIJS} 🪙)</button>`:""}${has1&&!has2&&e.hint2?`<button class="hintbtn" id="h2">🔦 Grote hint (${CONFIG.HINT2_PRIJS} 🪙)</button>`:""}
   ${has1?`<div class="hintbox" style="flex-basis:100%">💡 ${e.hint1}</div>`:""}${has2?`<div class="hintbox" style="flex-basis:100%">🔦 ${e.hint2}</div>`:""}`;
  const buy=(n,price)=>{if(r.done){r.hints.includes(n)||r.hints.push(n);drawHints(e);return;}
    if(P.coins<price){toast("Je hebt niet genoeg munten. 🪙 Verdien munten met juiste antwoorden!");return;}
    modal(`<div class="bigi">${n===1?"💡":"🔦"}</div><h2>${n===1?"Tip":"Grote hint"} kopen?</h2><p>Dit kost <b>${price} munten</b>.<br>Je krijgt voor deze oefening ook iets minder punten.</p><button class="btn" data-close="ja">Ja, graag</button> <button class="btn ghost" data-close>Nee</button>`,v=>{
      if(v!=="ja")return;P.coins-=price;P.coinsSpent+=price;r.hints.push(n);save();updTop();drawHints(e);});};
  if($("#h1"))$("#h1").onclick=()=>buy(1,CONFIG.HINT1_PRIJS);if($("#h2"))$("#h2").onclick=()=>buy(2,CONFIG.HINT2_PRIJS);
}
function updSkip(e){const r=R(e.id);$("#skipB").classList.toggle("hidden",r.done||r.skip||(r.fails||0)<CONFIG.OVERSLAAN_NA);}
function skipEx(e){const r=R(e.id);
  modal(`<div class="bigi">🤔</div><h2>Oefening overslaan?</h2><p>Je krijgt ${e.type==="editor"?"alleen punten voor de stappen die al juist zijn":"<b>0 punten</b> voor deze oefening"}. Je kan ze later nog opnieuw proberen.</p><button class="btn" data-close="ja">Ja, sla over</button> <button class="btn ghost" data-close>Nee, ik probeer nog eens</button>`,v=>{
    if(v!=="ja")return;r.skip=true;r.wasSkipped=true;P.streak=0;save();nextEx();});}
function succeed(e,from,extra){
  const r=R(e.id);
  if(r.done){$("#fb").innerHTML=`<div class="fb ok">✔ Juist! (oefenmodus)${e.explain?`<div class="ex">${e.explain}</div>`:""}</div>`;return;}
  document.querySelectorAll(".chkhint").forEach(x=>x.remove());
  r.att++;r.done=true;r.score=scoreFor(e,r);const c=coinsFor(e,r.att);
  if(r.att===1){P.streak++;P.bestStreak=Math.max(P.bestStreak,P.streak);}else P.streak=0;
  addCoins(c,from);save();
  $("#fb").innerHTML=`<div class="fb ok">🎉 ${r.att===1?"Juist, in één keer!":"Juist!"} +${fmtP(r.score)} punten, +${c} 🪙${extra?`<div class="ex">${extra}</div>`:""}${e.explain?`<div class="ex">${e.explain}</div>`:""}</div>`;
  mascotSay(MASCOT_OK[Math.floor(Math.random()*MASCOT_OK.length)]);confetti(r.att===1?30:12);
  checkBadges();updSide();updSkip(e);
  const nb=$("#nextB");if(nb){nb.classList.add("okb");nb.focus({preventScroll:true});}
}
function fail(e,msg,from){
  const r=R(e.id);
  if(!r.done){r.att++;r.fails=(r.fails||0)+1;P.streak=0;save();}
  $("#fb").innerHTML=`<div class="fb bad">✗ ${msg||"Nog niet juist. Probeer opnieuw!"}${!r.done&&r.att>=2&&!r.hints.includes(1)&&e.hint1?'<div class="ex">Lukt het niet? Koop een 💡 tip hieronder.</div>':""}</div>`;
  if(Math.random()<.5)mascotSay(MASCOT_BAD[Math.floor(Math.random()*MASCOT_BAD.length)]);
  updSkip(e);
}

RENDER.match=c=>{const {e}=c;const right=shuffle(e.pairs.map((p,i)=>i));let selL=null;const pair={};const COL=["#1f6fb2","#c43e1c","#2e7d32","#7b1fa2","#ef6c00","#00838f"];

RENDER.select=c=>{const {e}=c;
  let pi=0;const html=e.paras.map((lines,p)=>`<div class="para" data-p="${p}">${lines.map((ln,l)=>`<div class="ln" data-p="${p}" data-l="${l}"><div class="mg ${e.mode==="line"?"mgcur":""}" data-p="${p}" data-l="${l}"></div><div>${(p===0&&e.docTitle?`<span class="ttl">`:"")+ln.split(/(\s+)/).map(w=>/\S/.test(w)?`<span class="w">${esc(w)}</span>`:w).join("")+(p===0&&e.docTitle?"</span>":"")}${e.marks?'<span style="color:#2b579a">'+(l===lines.length-1?"¶":"↵")+"</span>":""}</div></div>`).join("")}</div>`).join("");
  const HOW={word:["🖱️🖱️","Zo doe je het: ga met je muis op het woord staan en klik <b>2 keer snel</b> na elkaar (= dubbelklikken)."],para:["🖱️🖱️🖱️","Zo doe je het: klik <b>3 keer snel</b> na elkaar ergens in de alinea."],line:["➡️","Zo doe je het: ga met je muis <b>links naast de regel</b>, in de witte rand (de marge). Je muispijl wijst dan naar rechts. Klik 1 keer."],drag:["✋","Zo doe je het: klik vóór het eerste woord, <b>houd de muisknop ingedrukt</b> en sleep tot na het laatste woord. Laat dan los."]}[e.mode];
  c.body.innerHTML=`<div class="howbox"><span class="hi">${HOW[0]}</span><span>${HOW[1]}</span></div><div class="doc" id="sdoc">${html}</div>`;
  const doc=$("#sdoc");const clean=s=>s.replace(/[.,!?:;]/g,"").trim().toLowerCase();
  const clear=()=>doc.querySelectorAll(".hit").forEach(x=>x.classList.remove("hit"));
  if(e.mode==="word"){doc.addEventListener("dblclick",ev=>{const w=ev.target.closest(".w");if(!w)return;clear();w.classList.add("hit");if(clean(w.textContent)===clean(e.target))c.ok(w);else c.bad(`Je selecteerde het woord <b>${esc(w.textContent)}</b>. Zoek het woord <b>${esc(e.target)}</b>.`,w);});
    doc.addEventListener("click",ev=>{if(ev.detail===1&&ev.target.closest(".w"))toast("Je klikte 1 keer. Klik 2 keer snel na elkaar! 🖱️🖱️");});}
  if(e.mode==="para"){doc.addEventListener("click",ev=>{const p=ev.target.closest(".para");if(!p)return;if(ev.detail===2)toast("Bijna! Klik nog een keer extra: 3 keer snel na elkaar.");
      if(ev.detail===3){clear();p.classList.add("hit");if(+p.dataset.p===e.target)c.ok(p);else c.bad(`Je selecteerde alinea ${+p.dataset.p+1}. Het moet alinea <b>${e.target+1}</b> zijn.`,p);}});}
  if(e.mode==="line"){doc.addEventListener("click",ev=>{const m=ev.target.closest(".mg");if(!m){if(ev.target.closest(".w"))toast("Klik níet op de tekst, maar links ernaast in de witte marge.");return;}clear();const ln=m.parentElement;ln.classList.add("hit");
      if(+m.dataset.p===e.target[0]&&+m.dataset.l===e.target[1])c.ok(ln);else c.bad("Dat is een andere regel. Kijk goed welke regel je moet selecteren.",ln);});}
  if(e.mode==="drag"){doc.addEventListener("mouseup",()=>{setTimeout(()=>{const s=getSelection().toString().replace(/\s+/g," ").trim();if(!s||s.split(" ").length<2)return;
      const n=x=>x.replace(/[↵¶]/g,"").replace(/\s+/g," ").trim().replace(/[.!?]$/,"");
      if(n(s)===n(e.target))c.ok(doc);else c.bad(`Je selecteerde: «${esc(s.slice(0,60))}${s.length>60?"…":""}». Selecteer precies de zin «${esc(e.target)}».`,doc);},10);});}
};

    const tds=[...c.body.querySelectorAll("td")];const grp=td=>tds.filter(x=>e.mode==="row"?x.dataset.r===td.dataset.r:e.mode==="col"?x.dataset.c===td.dataset.c:x===td);
    tds.forEach(td=>{td.onmouseenter=()=>grp(td).forEach(x=>x.classList.add("hov"));td.onmouseleave=()=>tds.forEach(x=>x.classList.remove("hov"));

        grp(td).forEach(x=>x.classList.add(ok?"okc":"badc"));if(ok){tds.forEach(x=>x.onclick=null);c.ok(td);}else c.bad(e.mode==="row"?`Dat is rij ${r+1}.`:e.mode==="col"?`Dat is kolom ${cc+1}.`:`Dat is de cel in rij ${r+1} en kolom ${cc+1}.`,td);};});return;}

   ============================================================ */
function levelDoneModal(L){const s=lvStats(L),n=LEVELS.indexOf(L)+1;confetti(80);
  modal(`<div class="bigi">🏁</div><h2>Level ${n} is klaar!</h2><div class="stars" style="font-size:2.4rem">${[1,2,3].map(k=>`<span class="${s.stars>=k?"":"off"}">⭐</span>`).join("")}</div>
   <p>Je score: <b>${fmtP(s.score)} op ${s.max}</b> (${s.pct}%)</p><p>Lever nu je puntenbestand in op <b>Teams</b>. Daarna gaat level ${n+1<=LEVELS.length?n+1:""} open.</p>
   <button class="btn big okb" data-close="inl">📤 Lever in op Teams</button> <button class="btn ghost" data-close>Later</button>`,v=>{if(v==="inl")exportLevelModal(L);else goHome();});}
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
function checksum(j){return cyrb53(JSON.stringify(j.data)+"|"+JSON.stringify(j.summary)+"|"+CONFIG.SALT);}
function buildExport(levelId){
  const summary={xp:totalXP(),rang:rankOf(totalXP()).name,munten:P.coins,muntenVerdiend:P.coinsEarned,muntenUitgegeven:P.coinsSpent,badges:Object.keys(P.badges),actieveMinuten:Math.round(P.activeSec/60),
    puntenregels:{punten:CONFIG.PUNTEN,hint1:CONFIG.HINT1_AFTREK,hint2:CONFIG.HINT2_AFTREK},ingeleverd:P.levelExported,instellingen:P.settings,
    levels:LEVELS.map(L=>{const s=lvStats(L);return {id:L.id,titel:L.title,score:s.score,max:s.max,pct:s.pct,gedaan:s.done,overgeslagen:s.hand-s.done,totaal:s.total,hints:s.hints,afgewerkt:s.finished,sterren:s.stars,extern:null};}),
    oefeningen:LEVELS.flatMap(L=>L.ex.map(e=>{const r=P.ex[e.id]||{};return {id:e.id,level:L.id,type:e.type,naam:e.short,status:r.done?"juist":r.skip?"overgeslagen":(r.att?"bezig":"niet gemaakt"),pogingen:r.att||0,score:exScore(e,r),max:maxOf(e),hints:(r.hints||[]).length};}))};
  const j={app:CONFIG.APP,wereld:"wordppt",version:1,naam:P.naam,klas:P.klas,levelExport:levelId||null,exportedAt:new Date().toISOString(),summary,data:P};j.checksum=checksum(j);return j;}
function fileBase(levelId){return ("DigilabAvontuur_WordPPT_"+(levelId?"Level"+(LEVELS.findIndex(L=>L.id===levelId)+1)+"_":"Backup_")+P.klas+"_"+P.naam).replace(/[^\w\-]+/g,"_");}
let DLNS=null;(async()=>{try{if(window.claude&&typeof window.claude.use==="function")DLNS=await window.claude.use("downloads");}catch(e){DLNS=null;}})();
async function saveFile(name,text){
  if(DLNS){try{await DLNS.save({filename:name,data:text});return true;}catch(e){const c=e&&e.code;toast(c==="declined"?"Download geannuleerd.":"Downloaden lukt hier niet. Vraag je leerkracht om hulp.");return false;}}
  const blob=new Blob([text],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);return true;}
async function download(levelId){P.exports++;save();const j=buildExport(levelId);const name=fileBase(levelId)+".json";return (await saveFile(name,JSON.stringify(j)))?name:null;}
function exportLevelModal(L){
  const n=LEVELS.indexOf(L)+1,s=lvStats(L),opdr=CONFIG.TEAMS_OPDRACHT.replace("{n}",n),fname=fileBase(L.id)+".json",again=!!P.levelExported[L.id];
  modal(`<div class="bigi">📤</div><h2>Lever level ${n} in op Teams</h2><p>Je score: <b>${fmtP(s.score)} op ${s.max}</b></p>
  <div style="text-align:left;background:var(--accl);border-radius:14px;padding:14px 18px;margin:12px 0"><ol style="margin:0;padding-left:22px;line-height:1.8">
    <li>Klik hieronder op <b>Download</b>. Het bestand komt in je map <b>Downloads</b>.</li>
    <li>Open <b>Teams</b> en ga naar het team van je klas.</li>
    <li>Klik op <b>Opdrachten</b> en open <b>«${esc(opdr)}»</b>.</li>
    <li>Klik op <b>+ Werk toevoegen</b> → <b>Uploaden vanaf dit apparaat</b>. Kies <b>${esc(fname)}</b>.</li>
    <li>Klik op <b>Inleveren</b>.</li></ol>
   ${again?`<p style="margin:10px 0 0">🔄 <b>Opnieuw inleveren?</b> Klik in Teams eerst op <b>Inleveren ongedaan maken</b>, verwijder het oude bestand en voeg het nieuwe toe.</p>`:""}</div>
  <button class="btn big" id="lvDl">⬇ Download puntenbestand</button>
  <p style="margin:16px 0 6px"><label style="display:inline-flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="lvOk" disabled style="width:22px;height:22px"> Ik heb mijn bestand ingeleverd in Teams.</label></p>
  <button class="btn okb" id="lvDone" data-close="done" disabled>✔ Klaar${n<LEVELS.length?" – open level "+(n+1):""}</button> <button class="btn ghost" data-close>Later</button>`,
  v=>{if(v==="done"){P.levelExported[L.id]={at:Date.now(),score:lvStats(L).score};save();confetti();goHome();toast(n<LEVELS.length?"🔓 Level "+(n+1)+" is open!":"🏆 Alles ingeleverd. Proficiat!");}},
  ov=>{const ok=ov.querySelector("#lvOk"),dn=ov.querySelector("#lvDone");ov.querySelector("#lvDl").onclick=async()=>{const r=await download(L.id);if(r){ok.disabled=false;toast("✅ Gedownload. Lever het nu in op Teams.");}};ok.onchange=()=>{dn.disabled=!ok.checked;};});
}

/* ============================================================
   WINKEL, BADGES, RANG, INSTELLINGEN
   ============================================================ */
function shopModal(){
  const draw=ov=>{const md=ov.querySelector(".md");md.innerHTML=`<h2>🛍️ Winkel</h2><p>Je hebt <b>🪙 ${P.coins}</b> munten.</p><div class="shop">${Object.keys(SHOPCAT).map(cat=>`<h3>${SHOPCAT[cat]}</h3>`+SHOP.filter(x=>x.cat===cat).map(it=>{const own=P.owned.includes(it.id),use=P[SLOT[cat]]===it.id;
      return `<div class="si ${own?"own":""}">${it.c?`<div class="sw" style="background:${it.c}"></div>`:`<div class="e">${it.e}</div>`}<b>${esc(it.n)}</b>${own?(use?'<small>✔ in gebruik</small>':`<button class="btn sec" data-use="${it.id}">Gebruik</button>`):`<button class="btn" data-buy="${it.id}" ${P.coins<it.prijs?"disabled":""}>🪙 ${it.prijs}</button>`}</div>`;}).join("")).join("")}</div>
      ${P.avatar?`<button class="btn ghost" data-use="noav">Geen avatar</button> `:""}<button class="btn" data-close>Sluiten</button>`;
    md.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const it=SHOP.find(x=>x.id===b.dataset.buy);if(P.coins<it.prijs)return;P.coins-=it.prijs;P.coinsSpent+=it.prijs;P.owned.push(it.id);P[SLOT[it.cat]]=it.id;save();updTop();checkBadges();confetti(30);toast("🎉 Gekocht: "+esc(it.n));draw(ov);});
    md.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{if(b.dataset.use==="noav")P.avatar=null;else{const it=SHOP.find(x=>x.id===b.dataset.use);P[SLOT[it.cat]]=it.id;}save();updTop();draw(ov);});};
  modal("",null,draw,true);}
function badgesModal(){const xp=totalXP(),rk=rankOf(xp);
  modal(`<h2>🏅 Badges en rang</h2><p>Je rang: <b>${rk.e} ${esc(rk.name)}</b> met ${fmtP(xp)} XP${rk.next?` – nog ${fmtP(rk.next-xp)} XP tot de volgende rang`:""}.</p>
   <div class="ranks">${RANKS.map((r,k)=>`<div class="rk ${k<rk.i?"done":k===rk.i?"now":""}"><span class="re">${r[2]}</span><span class="rn"><b>${esc(r[1])}</b> <small>vanaf ${r[0]} XP</small></span><span>${k<=rk.i?"✔":"🔒"}</span></div>`).join("")}</div>
   <div class="badges">${BADGES.map(b=>{const got=!!P.badges[b.id];const pr=b.prog?b.prog(P):null;return `<div class="bd ${got?"got":""}"><div class="e">${b.e}</div><b>${esc(b.n)}</b><small>${esc(b.d)}</small>${!got&&pr?`<small>${Math.min(pr[0],pr[1])}/${pr[1]}</small>`:""}</div>`;}).join("")}</div>
   <button class="btn" data-close>Sluiten</button>`,null,null,true);}
function menuModal(){
  modal(`<h2>⚙️ Menu</h2><div style="display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:380px;margin:0 auto;text-align:left">
   <label style="display:flex;gap:10px;align-items:center;font-weight:700"><input type="checkbox" id="stV" ${P.settings.voorlezen?"checked":""} style="width:22px;height:22px"> 🔊 Vragen automatisch voorlezen</label>
   <label style="display:flex;gap:10px;align-items:center;font-weight:700"><input type="checkbox" id="stG" ${P.settings.groot?"checked":""} style="width:22px;height:22px"> 🔎 Grote letters</label>
   <button class="btn sec" data-close="bk">💾 Back-up van mijn voortgang</button><button class="btn sec" data-close="out">🚪 Afmelden</button><button class="btn" data-close>Sluiten</button></div>`,
   v=>{if(v==="out"){save();STORE.current=null;persist();showLogin();}if(v==="bk")download(null).then(r=>{if(r)toast("💾 Back-up gedownload. Met dit bestand kan je op een andere computer verder werken.");});},
   ov=>{ov.querySelector("#stV").onchange=e=>{P.settings.voorlezen=e.target.checked;save();};ov.querySelector("#stG").onchange=e=>{P.settings.groot=e.target.checked;save();updTop();};});}

/* ============================================================
   START
   ============================================================ */
$("#tShop").onclick=shopModal;$("#tBadges").onclick=badgesModal;$("#tMenu").onclick=menuModal;$("#cXP").onclick=badgesModal;$("#cCoins").onclick=shopModal;
$("#logo").onclick=()=>{if(P)goHome();};
let lastAct=Date.now();["mousedown","keydown"].forEach(ev=>document.addEventListener(ev,()=>lastAct=Date.now()));
setInterval(()=>{if(P&&!document.hidden&&Date.now()-lastAct<60000){P.activeSec+=10;if(P.activeSec%60===0)save();}},10000);
window.addEventListener("beforeunload",save);
if(STORE.current&&STORE.profiles[STORE.current]){P=STORE.profiles[STORE.current];migrate();goHome();}else showLogin();

</script>
</body>
